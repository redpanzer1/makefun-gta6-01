<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kota Senja: Jalanan Panas</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1026; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #1a1026; }
  /* Dibaca, tak terlihat: baris status yang diumumkan pembaca layar. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Kota Senja: Jalanan Panas — game open-world kriminal orisinal. WASD untuk bergerak, E untuk masuk atau mencuri mobil, klik untuk menembak."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
